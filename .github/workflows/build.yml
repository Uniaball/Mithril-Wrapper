name: build-mithril

# Build-only workflow: produces the libmithril artifacts (macOS dylib, iOS
# device dylib, Linux .so), verifies their exported symbol tables, and uploads
# them as artifacts. The smoke tests are run by test.yml, which is triggered
# from this workflow via workflow_run and consumes these artifacts.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---- macOS + iOS: produce both deliverable libmithril dylibs -------------
  build-macos-ios:
    runs-on: macos-26
    strategy:
      matrix:
        include:
          - name: macos
            artifact: libmithril-macos-arm64
            cmake_args: "-DCMAKE_BUILD_TYPE=Release"
          - name: ios
            artifact: libmithril-ios-arm64
            cmake_args: "-DMITHRIL_IOS=ON -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -DCMAKE_BUILD_TYPE=Release"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ccache
        run: brew install ccache

      - name: Cache ccache (${{ matrix.name }})
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-${{ matrix.name }}-ccache-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.name }}-ccache-

      - name: Configure (${{ matrix.name }} arm64 Release)
        run: cmake -S . -B build ${{ matrix.cmake_args }} -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        env:
          CCACHE_DIR: ~/.cache/ccache

      - name: Build (${{ matrix.name }})
        run: cmake --build build -j$(sysctl -n hw.ncpu)
        env:
          CCACHE_DIR: ~/.cache/ccache

      # LIBRARY_OUTPUT_DIRECTORY is fixed to ./output for both platforms; the
      # matrix instances run on separate runners with their own checkout, so
      # renaming before upload just keeps the artifact name unambiguous.
      - name: Locate dylib
        id: locate
        run: |
          [ -f output/libmithril.dylib ] || (echo "dylib not found in output/" && exit 1)
          mv output/libmithril.dylib "output/libmithril-${{ matrix.name }}.dylib"
          echo "path=output/libmithril-${{ matrix.name }}.dylib" >> "$GITHUB_OUTPUT"
          file "output/libmithril-${{ matrix.name }}.dylib"

      - name: Verify exported EGL symbols (contract set)
        run: |
          NM_OUT=$(nm -gU "${{ steps.locate.outputs.path }}")
          missing=0
          for sym in eglBindAPI eglChooseConfig eglCreateContext eglCreateWindowSurface \
                     eglDestroyContext eglDestroySurface eglGetConfigAttrib \
                     eglGetCurrentContext eglGetCurrentSurface eglGetDisplay eglGetError \
                     eglGetPlatformDisplay eglInitialize eglMakeCurrent eglReleaseThread \
                     eglSwapBuffers eglSwapInterval eglTerminate; do
            if echo "$NM_OUT" | grep -qE " T _?${sym}$"; then
              echo "ok  $sym"
            else
              echo "MISS $sym"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          echo "egl* symbols:"
          echo "$NM_OUT" | grep -cE ' _egl'

      - name: Verify GL symbol table (3.3 core exports)
        run: |
          NM_OUT=$(nm -gU "${{ steps.locate.outputs.path }}")
          GL_COUNT=$(echo "$NM_OUT" | grep -cE ' T _?gl[A-Z0-9]')
          echo "gl* defined exports: $GL_COUNT"
          [ "$GL_COUNT" -ge 342 ]

      - name: Ad-hoc codesign
        run: codesign -s - "${{ steps.locate.outputs.path }}" || \
             echo "codesign skipped (best-effort)"

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error

  # ---- Linux: produce libmithril.so for the Linux test job -----------------
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ccache
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache

      - name: Cache ccache (linux)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Configure (Linux Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        env:
          CCACHE_DIR: ~/.cache/ccache

      - name: Build (Linux)
        run: cmake --build build -j$(nproc)
        env:
          CCACHE_DIR: ~/.cache/ccache

      - name: Verify exported symbols (Linux .so)
        run: |
          [ -f output/libmithril.so ] || (echo ".so not found in output/" && exit 1)
          GL_COUNT=$(nm -D --defined-only output/libmithril.so | awk '{print $3}' | grep -cE '^gl[A-Z0-9]')
          echo "GL* defined exports: $GL_COUNT"
          [ "$GL_COUNT" -ge 342 ]
          EGL_COUNT=$(nm -D --defined-only output/libmithril.so | awk '{print $3}' | grep -c '^egl')
          echo "egl* defined exports: $EGL_COUNT"
          [ "$EGL_COUNT" -ge 40 ]

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: libmithril-linux-x86_64
          path: output/libmithril.so
          if-no-files-found: error
