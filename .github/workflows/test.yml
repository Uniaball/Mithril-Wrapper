name: test-mithril

# Test-only workflow: runs the smoke tests against the artifacts produced by
# build.yml. Triggered by build.yml completing successfully on main (via
# workflow_run), or manually via workflow_dispatch (which resolves the most
# recent successful build run). Each job downloads the artifact it needs and
# runs the tests on that platform's runner.

on:
  workflow_run:
    workflows: ["build-mithril"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # ---- macOS: boot the engine under MoltenVK (Metal path) -----------------
  # Includes mcshape_smoke, the MC-style GUI shader test with exact pixel
  # assertions that catches orientation/uv regressions.
  test-macos-metal:
    runs-on: macos-26
    steps:
      - name: Resolve build run
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-mithril \
                     --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ steps.resolve.outputs.sha }}

      - name: Download macOS dylib
        uses: actions/download-artifact@v4
        with:
          name: libmithril-macos-arm64
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.resolve.outputs.run_id }}

      - name: Place dylib where smoke binaries expect it
        run: |
          # download-artifact@v4 unpacks into <path>/<artifact-name>/...
          DYLIB=$(find artifacts -name "*.dylib" | head -1)
          [ -n "$DYLIB" ] || { echo "no dylib artifact found"; exit 1; }
          mkdir -p output
          mv "$DYLIB" output/libmithril.dylib
          file output/libmithril.dylib

      - name: Install Vulkan loader + MoltenVK (Homebrew)
        run: |
          brew install vulkan-loader molten-vk
          brew --prefix
          ls "$(brew --prefix)/share/vulkan/icd.d/" 2>/dev/null || true

      - name: Cache ccache (macos-metal)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-metal-test-ccache-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-metal-test-ccache-

      - name: Build smoke test binaries
        run: |
          export CCACHE_DIR=~/.cache/ccache
          clang -o tests/swapchain_smoke tests/swapchain_smoke.c -ldl -lobjc -framework QuartzCore
          clang -o tests/sync_smoke       tests/sync_smoke.c       -ldl
          clang -o tests/query_smoke      tests/query_smoke.c      -ldl
          clang -o tests/sampler_smoke    tests/sampler_smoke.c    -ldl
          clang -o tests/contract_smoke   tests/contract_smoke.c   -ldl
          clang -o tests/state_smoke      tests/state_smoke.c      -ldl
          clang -o tests/shader_smoke     tests/shader_smoke.c     -ldl
          clang -o tests/draw_smoke       tests/draw_smoke.c       -ldl
          clang -o tests/mcshape_smoke    tests/mcshape_smoke.c    -ldl -lobjc
          clang -o tests/intattr_smoke    tests/intattr_smoke.c    -ldl
          clang -o tests/texture_smoke    tests/texture_smoke.c    -ldl
          clang -o tests/fbo_smoke        tests/fbo_smoke.c        -ldl
          clang -o tests/3d_smoke         tests/3d_smoke.c         -ldl -lm
          clang -o tests/render3d_smoke   tests/render3d_smoke.c   -ldl -lm
          clang -o tests/multiframe_smoke tests/multiframe_smoke.c -ldl -lm
          clang -o tests/multiubo_smoke   tests/multiubo_smoke.c   -ldl

      - name: Run swapchain surface smoke against MoltenVK
        run: |
          export DYLD_LIBRARY_PATH="$(brew --prefix)/lib"
          export VK_ICD_FILENAMES="$(brew --prefix)/etc/vulkan/icd.d/MoltenVK_icd.json"
          export VK_LOADER_DEBUG=error
          export LD_LIBRARY_PATH="$PWD/output"
          output=$(./tests/swapchain_smoke)
          echo "$output"
          echo "$output" | grep -q "SWAPCHAIN SMOKE ALL PASSED"

      - name: Run GL sync object smoke against MoltenVK
        run: |
          export DYLD_LIBRARY_PATH="$(brew --prefix)/lib"
          export VK_ICD_FILENAMES="$(brew --prefix)/etc/vulkan/icd.d/MoltenVK_icd.json"
          export VK_LOADER_DEBUG=error
          export LD_LIBRARY_PATH="$PWD/output"
          output=$(./tests/sync_smoke 2>&1) || true
          echo "$output"
          echo "$output" | grep -q "SYNC SMOKE ALL PASSED"

      - name: Run S6 query object smoke against MoltenVK
        run: |
          export DYLD_LIBRARY_PATH="$(brew --prefix)/lib"
          export VK_ICD_FILENAMES="$(brew --prefix)/etc/vulkan/icd.d/MoltenVK_icd.json"
          export VK_LOADER_DEBUG=error
          export LD_LIBRARY_PATH="$PWD/output"
          output=$(./tests/query_smoke 2>&1) || true
          echo "$output"
          echo "$output" | grep -q "QUERY SMOKE ALL PASSED"

      - name: Run S6 sampler object smoke against MoltenVK
        run: |
          export DYLD_LIBRARY_PATH="$(brew --prefix)/lib"
          export VK_ICD_FILENAMES="$(brew --prefix)/etc/vulkan/icd.d/MoltenVK_icd.json"
          export VK_LOADER_DEBUG=error
          export LD_LIBRARY_PATH="$PWD/output"
          output=$(./tests/sampler_smoke 2>&1) || true
          echo "$output"
          echo "$output" | grep -q "SAMPLER SMOKE ALL PASSED"

      - name: Run EGL contract smoke against MoltenVK
        run: |
          export DYLD_LIBRARY_PATH="$(brew --prefix)/lib"
          export VK_ICD_FILENAMES="$(brew --prefix)/etc/vulkan/icd.d/MoltenVK_icd.json"
          export VK_LOADER_DEBUG=error
          export LD_LIBRARY_PATH="$PWD/output"
          output=$(./tests/contract_smoke)
          echo "$output"
          echo "$output" | grep -q "ALL CONTRACT CHECKS PASSED"

      - name: Run GL state machine smoke against MoltenVK
        run: |
          export DYLD_LIBRARY_PATH="$(brew --prefix)/lib"
          export VK_ICD_FILENAMES="$(brew --prefix)/etc/vulkan/icd.d/MoltenVK_icd.json"
          export VK_LOADER_DEBUG=error
          export LD_LIBRARY_PATH="$PWD/output"
          output=$(./tests/state_smoke)
          echo "$output"
          echo "$output" | grep -q "STATE SMOKE ALL PASSED"

      - name: Run shader pipeline smoke against MoltenVK
        run: |
          export DYLD_LIBRARY_PATH="$(brew --prefix)/lib"
          export VK_ICD_FILENAMES="$(brew --prefix)/etc/vulkan/icd.d/MoltenVK_icd.json"
          export VK_LOADER_DEBUG=error
          export LD_LIBRARY_PATH="$PWD/output"
          output=$(./tests/shader_smoke)
          echo "$output"
          echo "$output" | grep -q "SHADER SMOKE ALL PASSED"

      - name: Run GL->Vulkan draw smoke against MoltenVK
        run: |
          export DYLD_LIBRARY_PATH="$(brew --prefix)/lib"
          export VK_ICD_FILENAMES="$(brew --prefix)/etc/vulkan/icd.d/MoltenVK_icd.json"
          export VK_LOADER_DEBUG=error
          export LD_LIBRARY_PATH="$PWD/output"
          output=$(./tests/draw_smoke 2>&1) || true
          echo "$output"
          echo "$output" | grep -q "DRAW SMOKE ALL PASSED"

      - name: Run MC-style GUI shader smoke against MoltenVK
        run: |
          export DYLD_LIBRARY_PATH="$(brew --prefix)/lib"
          export VK_ICD_FILENAMES="$(brew --prefix)/etc/vulkan/icd.d/MoltenVK_icd.json"
          export VK_LOADER_DEBUG=error
          export LD_LIBRARY_PATH="$PWD/output"
          output=$(./tests/mcshape_smoke 2>&1) || true
          echo "$output"
          echo "$output" | grep -q "MCSHAPE SMOKE ALL PASSED"

      - name: Run integer-attribute pipeline smoke against MoltenVK
        run: |
          export DYLD_LIBRARY_PATH="$(brew --prefix)/lib"
          export VK_ICD_FILENAMES="$(brew --prefix)/etc/vulkan/icd.d/MoltenVK_icd.json"
          export VK_LOADER_DEBUG=error
          export LD_LIBRARY_PATH="$PWD/output"
          output=$(./tests/intattr_smoke 2>&1) || true
          echo "$output"
          echo "$output" | grep -q "INTATTR SMOKE ALL PASSED"

      - name: Run GL->Vulkan texture smoke against MoltenVK
        run: |
          export DYLD_LIBRARY_PATH="$(brew --prefix)/lib"
          export VK_ICD_FILENAMES="$(brew --prefix)/etc/vulkan/icd.d/MoltenVK_icd.json"
          export VK_LOADER_DEBUG=error
          export LD_LIBRARY_PATH="$PWD/output"
          output=$(./tests/texture_smoke 2>&1) || true
          echo "$output"
          echo "$output" | grep -q "TEXTURE SMOKE ALL PASSED"

      - name: Run GL->Vulkan state-pipeline smoke against MoltenVK
        run: |
          export DYLD_LIBRARY_PATH="$(brew --prefix)/lib"
          export VK_ICD_FILENAMES="$(brew --prefix)/etc/vulkan/icd.d/MoltenVK_icd.json"
          export VK_LOADER_DEBUG=error
          export LD_LIBRARY_PATH="$PWD/output"
          output=$(./tests/fbo_smoke 2>&1) || true
          echo "$output"
          echo "$output" | grep -q "FBO SMOKE ALL PASSED"

      - name: Run 3D depth/perspective smoke against MoltenVK
        run: |
          export DYLD_LIBRARY_PATH="$(brew --prefix)/lib"
          export VK_ICD_FILENAMES="$(brew --prefix)/etc/vulkan/icd.d/MoltenVK_icd.json"
          export VK_LOADER_DEBUG=error
          export LD_LIBRARY_PATH="$PWD/output"
          output=$(./tests/3d_smoke 2>&1) || true
          echo "$output"
          echo "$output" | grep -q "3D SMOKE"

      - name: Run 3D scene render smoke against MoltenVK
        run: |
          export DYLD_LIBRARY_PATH="$(brew --prefix)/lib"
          export VK_ICD_FILENAMES="$(brew --prefix)/etc/vulkan/icd.d/MoltenVK_icd.json"
          export VK_LOADER_DEBUG=error
          export LD_LIBRARY_PATH="$PWD/output"
          output=$(./tests/render3d_smoke 2>&1) || true
          echo "$output"
          echo "$output" | grep -q "RENDER SMOKE"

      - name: Install ffmpeg (macOS)
        run: brew install ffmpeg

      - name: Convert 3D animation to MP4 + preview PNG (MoltenVK)
        run: |
          ffmpeg -y -framerate 30 -i tests/render3d/frame_%04d.ppm \
                 -c:v libx264 -pix_fmt yuv420p -movflags +faststart tests/render3d.mp4
          ffmpeg -y -i tests/render3d/frame_0000.ppm tests/render3d.png
          ls -la tests/render3d.mp4 tests/render3d.png

      - name: Upload 3D render animation (artifact, Metal)
        uses: actions/upload-artifact@v4
        with:
          name: mithril-render3d-animation-metal
          path: |
            tests/render3d.mp4
            tests/render3d.png
          if-no-files-found: error

      - name: Run multiframe ring smoke against MoltenVK
        run: |
          export DYLD_LIBRARY_PATH="$(brew --prefix)/lib"
          export VK_ICD_FILENAMES="$(brew --prefix)/etc/vulkan/icd.d/MoltenVK_icd.json"
          export VK_LOADER_DEBUG=error
          export LD_LIBRARY_PATH="$PWD/output"
          output=$(./tests/multiframe_smoke 2>&1) || true
          echo "$output"
          echo "$output" | grep -q "MULTIFRAME SMOKE ALL PASSED"

      - name: Run multi-draw UBO smoke against MoltenVK
        run: |
          export DYLD_LIBRARY_PATH="$(brew --prefix)/lib"
          export VK_ICD_FILENAMES="$(brew --prefix)/etc/vulkan/icd.d/MoltenVK_icd.json"
          export VK_LOADER_DEBUG=error
          export LD_LIBRARY_PATH="$PWD/output"
          output=$(./tests/multiubo_smoke 2>&1) || true
          echo "$output"
          echo "$output" | grep -q "MULTIUBO SMOKE ALL PASSED"

  # ---- iOS Simulator: run the smoke on a simulated iOS device --------------
  # Builds an iphonesimulator libmithril.dylib + a simulator MoltenVK and runs
  # mcshape_smoke inside a booted iOS Simulator (closest CI approximation of
  # the real device path). The MoltenVK build is cached to keep the job fast.
  test-ios-simulator:
    runs-on: macos-26
    steps:
      - name: Resolve build run
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-mithril \
                     --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ steps.resolve.outputs.sha }}

      - name: Install ccache
        run: brew install ccache

      - name: Cache ccache (ios-sim)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-iossim-ccache-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-iossim-ccache-

      - name: Build libmithril (iOS Simulator)
        run: |
          cmake -S . -B build-ios-sim \
            -DMITHRIL_IOS=ON -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-ios-sim -j$(sysctl -n hw.ncpu)
          file output/libmithril.dylib
        env:
          CCACHE_DIR: ~/.cache/ccache

      - name: Cache MoltenVK (iOS Simulator dylib)
        id: cache-mvk
        uses: actions/cache@v4
        with:
          path: MoltenVK-sim
          key: moltenvk-iossim-${{ runner.os }}-v1.4.2

      - name: Download prebuilt MoltenVK (iOS Simulator dylib)
        if: steps.cache-mvk.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The official release ships the iOS Simulator slice only as a static
          # .a inside an XCFramework, but its dynamic xcframework also carries a
          # MoltenVK.framework whose binary IS a runnable dylib for the
          # simulator. Extract that one binary (it is what libmithril dlopens as
          # @loader_path/libMoltenVK.dylib at runtime).
          gh release download -R KhronosGroup/MoltenVK --pattern "MoltenVK-all.tar" --dir /tmp
          mkdir -p MoltenVK-sim
          tar -C MoltenVK-sim -xzf /tmp/MoltenVK-all.tar \
            MoltenVK/MoltenVK/dynamic/MoltenVK.xcframework/ios-arm64_x86_64-simulator/MoltenVK.framework/MoltenVK

      - name: Locate MoltenVK dylib
        id: mvk
        run: |
          MVK=$(find MoltenVK-sim -type f -name "MoltenVK" | head -1)
          [ -n "$MVK" ] || { echo "MoltenVK simulator dylib not found"; exit 1; }
          file "$MVK"
          echo "path=$MVK" >> "$GITHUB_OUTPUT"

      - name: Ensure iOS Simulator runtime
        run: |
          xcrun simctl list runtimes available || true
          if ! xcrun simctl list runtimes available | grep -q "iOS"; then
            xcodebuild -downloadPlatform iOS
            xcrun simctl list runtimes available
          fi

      - name: Compile mcshape_smoke for iOS Simulator
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then TARGET=arm64-apple-ios14.0-simulator; else TARGET=x86_64-apple-ios14.0-simulator; fi
          clang -target "$TARGET" -isysroot "$SDK" -o tests/mcshape_smoke_sim tests/mcshape_smoke.c -lobjc
          file tests/mcshape_smoke_sim

      - name: Boot simulator, deploy and run mcshape
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); [print(v["udid"]) or sys.exit(0) for typ,devs in d["devices"].items() for v in devs if v["isAvailable"]]')
          [ -n "$UDID" ] || { echo "no available simulator device"; exit 1; }
          echo "booting simulator $UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          # simctl spawn resolves the program path on the HOST filesystem (the
          # simulator shares the macOS kernel); the sim's dyld environment
          # (DYLD_ROOT_PATH -> iOS runtime root) makes the iOS-simulator
          # binaries link iOS-simulator libSystem. So deploy to a host path,
          # NOT the device data dir (a path only in $DATA/tmp is "missing" to
          # launchd -> LaunchdSimError 111).
          mkdir -p /tmp/mr/output
          cp output/libmithril.dylib /tmp/mr/output/
          # The extracted framework binary is named `MoltenVK`; libmithril dlopens
          # @loader_path/libMoltenVK.dylib next to itself, so rename on deploy.
          cp "${{ steps.mvk.outputs.path }}" /tmp/mr/output/libMoltenVK.dylib
          cp tests/mcshape_smoke_sim /tmp/mr/
          chmod +x /tmp/mr/mcshape_smoke_sim
          # Run the binary directly (no /bin/sh wrapper: the macOS dyld cannot
          # load iOS-simulator binaries, so simctl spawn /bin/sh aborts).
          # SIMCTL_CHILD_* forwards env into the spawned process; the test reads
          # MITHRIL_LIB_PATH so it does not depend on the CWD.
          # Record the whole run so a crash or black screen is visible after
          # the fact; recordVideo streams until it gets SIGINT.
          xcrun simctl io "$UDID" recordVideo --codec h264 /tmp/mr/mcshape_sim.mp4 &
          REC_PID=$!
          sleep 1
          SIMCTL_CHILD_MITHRIL_LIB_PATH=/tmp/mr/output/libmithril.dylib \
          SIMCTL_CHILD_MITHRIL_DUMP_PPM=/tmp/mr/frame.ppm \
          SIMCTL_CHILD_MVK_CONFIG_LOG_LEVEL=3 \
          SIMCTL_CHILD_MVK_CONFIG_USE_METAL_ARGUMENT_BUFFERS=0 \
            xcrun simctl spawn "$UDID" /tmp/mr/mcshape_smoke_sim \
            > mcshape_sim.txt 2>&1 || true
          # The test renders offscreen, so the screen would otherwise stay on
          # the home screen. Put the dumped frame into the simulator Photos app
          # and open it so the recording actually shows the rendered result.
          if [ -f /tmp/mr/frame.ppm ]; then
            sips -s format png /tmp/mr/frame.ppm --out /tmp/mr/frame.png >/dev/null
            xcrun simctl addmedia "$UDID" /tmp/mr/frame.png
            xcrun simctl openurl "$UDID" photos-redirect:// || true
            sleep 3
          fi
          sleep 1
          kill -INT "$REC_PID" 2>/dev/null || true
          wait "$REC_PID" 2>/dev/null || true
          cat mcshape_sim.txt
          # dump any simulator crash reports for the smoke binary
          ls -t "$HOME/Library/Logs/DiagnosticReports/" 2>/dev/null | head -5 || true
          # keep the recording as an artifact even when the check fails below
          cp /tmp/mr/mcshape_sim.mp4 mcshape_sim.mp4 2>/dev/null || true
          grep -q "MCSHAPE SMOKE ALL PASSED" mcshape_sim.txt

      - name: Upload iOS simulator screen recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mithril-ios-sim-screen-recording
          path: mcshape_sim.mp4
          if-no-files-found: warn

  # ---- iOS Simulator: real launcher + real Minecraft e2e with recording -----
  # Clones the launcher (cached, pinned to the commit the patch is based on),
  # applies launcher-patch/*.patch, builds a fresh iOS-Simulator libmithril.dylib,
  # swaps it into the launcher bundle, builds the launcher .app for the
  # simulator, installs it, downloads+launches MC via the CLI hook (AIR_* env),
  # and records the screen for development/debugging. Recording and the
  # launcher's latestlog.txt are always uploaded as artifacts.
  test-ios-launcher-e2e:
    runs-on: macos-26
    env:
      LAUNCHER_REPO: LiuLPigeon617/Air_with-mithril
      LAUNCHER_REV: f8035a1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ccache
        run: brew install ccache

      - name: Cache ccache (ios-launcher-e2e)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-iossim-e2e-ccache-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-iossim-e2e-ccache-

      - name: Build libmithril (iOS Simulator)
        run: |
          cmake -S . -B build-ios-sim \
            -DMITHRIL_IOS=ON -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES="arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-ios-sim -j$(sysctl -n hw.ncpu)
          file output/libmithril.dylib
        env:
          CCACHE_DIR: ~/.cache/ccache

      - name: Cache MoltenVK (iOS Simulator dylib)
        id: cache-mvk
        uses: actions/cache@v4
        with:
          path: MoltenVK-sim
          key: moltenvk-iossim-${{ runner.os }}-v1.4.2-e2e

      - name: Download prebuilt MoltenVK (iOS Simulator dylib)
        if: steps.cache-mvk.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R KhronosGroup/MoltenVK --pattern "MoltenVK-all.tar" --dir /tmp
          mkdir -p MoltenVK-sim
          tar -C MoltenVK-sim -xzf /tmp/MoltenVK-all.tar \
            MoltenVK/MoltenVK/dynamic/MoltenVK.xcframework/ios-arm64_x86_64-simulator/MoltenVK.framework/MoltenVK

      - name: Ensure iOS Simulator runtime
        run: |
          xcrun simctl list runtimes available || true
          if ! xcrun simctl list runtimes available | grep -q "iOS"; then
            xcodebuild -downloadPlatform iOS
            xcrun simctl list runtimes available
          fi

      - name: Clone launcher source (cached, pinned rev)
        uses: actions/cache@v4
        id: launcher-cache
        with:
          path: launcher-src
          key: launcher-${{ env.LAUNCHER_REV }}-${{ runner.os }}
      - name: Fetch launcher source
        if: steps.launcher-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 \
            "https://github.com/${{ env.LAUNCHER_REPO }}.git" launcher-src
          git -C launcher-src checkout "${{ env.LAUNCHER_REV }}" 2>/dev/null || true

      - name: Apply launcher patch
        run: |
          PATCH=$(find launcher-patch -name '*.patch' | head -1)
          [ -n "$PATCH" ] || { echo "no launcher patch found"; exit 1; }
          echo "applying $PATCH"
          git -C launcher-src apply --check "$PWD/$PATCH"
          git -C launcher-src apply "$PWD/$PATCH"

      - name: Replace launcher mithril dylib with freshly built one
        run: |
          # The launcher bundles libmithril.dylib as a renderer; swap in the
          # just-built iOS-Simulator dylib so the e2e exercises OUR build.
          cp output/libmithril.dylib output/libmithril.sim.dylib
          file output/libmithril.sim.dylib

      - name: Build launcher .app for iOS Simulator
        run: |
          cd launcher-src
          # Device-only Makefile cannot target the simulator, so drive the Xcode
          # project directly against the iphonesimulator SDK (best-effort e2e).
          xcodebuild -project Amethyst.xcodeproj \
            -scheme AngelAuraAmethyst -sdk iphonesimulator \
            -configuration Release -arch arm64 \
            -derivedDataPath /tmp/launcher-dd build \
            CODE_SIGNING_ALLOWED=NO

      - name: Locate launcher .app
        id: app
        run: |
          APP=$(find /tmp/launcher-dd -name "*.app" -type d | head -1)
          [ -n "$APP" ] || { echo "no launcher .app produced"; exit 1; }
          echo "path=$APP" >> "$GITHUB_OUTPUT"
          ls -la "$APP"

      - name: Swap mithril dylib into launcher bundle
        run: |
          APP="${{ steps.app.outputs.path }}"
          MVK=$(find MoltenVK-sim -type f -name "MoltenVK" | head -1)
          mkdir -p "$APP/Frameworks"
          cp output/libmithril.sim.dylib "$APP/Frameworks/libmithril.dylib"
          [ -n "$MVK" ] && cp "$MVK" "$APP/Frameworks/libMoltenVK.dylib" || true
          file "$APP/Frameworks/libmithril.dylib"

      - name: Boot simulator and install launcher
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); [print(v["udid"]) or sys.exit(0) for typ,devs in d["devices"].items() for v in devs if v["isAvailable"]]')
          [ -n "$UDID" ] || { echo "no available simulator device"; exit 1; }
          echo "$UDID" > /tmp/e2e_udid
          echo "booting simulator $UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          # Simulator apps need a (ad-hoc) signature even with signing disabled.
          codesign --force --sign - "${{ steps.app.outputs.path }}" 2>/dev/null || true
          xcrun simctl install "$UDID" "${{ steps.app.outputs.path }}"

      - name: Launch MC via CLI hook and record screen
        run: |
          UDID=$(cat /tmp/e2e_udid)
          # Record the whole run; recordVideo streams until it gets SIGINT.
          xcrun simctl io "$UDID" recordVideo --codec h264 /tmp/e2e.mp4 &
          REC_PID=$!
          sleep 2
          # AIR_AUTOLAUNCH=1 downloads + launches the requested MC version using
          # the CLI hook; SIMCTL_CHILD_* forwards env into the spawned process.
          SIMCTL_CHILD_AIR_AUTOLAUNCH=1 \
          SIMCTL_CHILD_AIR_VERSION="${AIR_VERSION:-1.21.4}" \
          SIMCTL_CHILD_AIR_RENDERER=libmithril.dylib \
          SIMCTL_CHILD_AIR_USERNAME=CI \
          SIMCTL_CHILD_AIR_MEMORY_MB=2048 \
          SIMCTL_CHILD_MVK_CONFIG_LOG_LEVEL=3 \
          SIMCTL_CHILD_MVK_CONFIG_USE_METAL_ARGUMENT_BUFFERS=0 \
            xcrun simctl launch "$UDID" com.air-devs.air \
            > /tmp/launch.txt 2>&1 || true
          # Give MC time to download + boot (bounded), then stop the recording.
          sleep 120
          kill -INT "$REC_PID" 2>/dev/null || true
          wait "$REC_PID" 2>/dev/null || true
          cat /tmp/launch.txt
          # Collect the launcher log for the artifact upload below.
          cp "$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data/Containers/Data/Application"/*/Documents/latestlog.txt /tmp/latestlog.txt 2>/dev/null || true
          cp /tmp/e2e.mp4 /tmp/e2e-recording.mp4 2>/dev/null || true
          ls -la /tmp/latestlog.txt /tmp/e2e-recording.mp4 2>/dev/null || true
        env:
          AIR_VERSION: ${{ vars.AIR_VERSION }}

      - name: Upload launcher e2e screen recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-e2e-screen-recording
          path: /tmp/e2e-recording.mp4
          if-no-files-found: warn

      - name: Upload launcher latestlog.txt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-e2e-latestlog-txt
          path: /tmp/latestlog.txt
          if-no-files-found: warn

  # ---- Linux: run the smoke tests against the Linux .so --------------------
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve build run
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-mithril \
                     --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ steps.resolve.outputs.sha }}

      - name: Download Linux .so
        uses: actions/download-artifact@v4
        with:
          name: libmithril-linux-x86_64
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.resolve.outputs.run_id }}

      - name: Install Vulkan runtime (lavapipe) + ccache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers ffmpeg ccache
          vulkaninfo --summary 2>/dev/null | head -10 || true

      - name: Cache ccache (linux)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-linux-test-ccache-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-linux-test-ccache-

      - name: Place .so where smoke binaries expect it
        run: |
          SO=$(find artifacts -name "*.so" | head -1)
          [ -n "$SO" ] || { echo "no .so artifact found"; exit 1; }
          mkdir -p output
          mv "$SO" output/libmithril.so

      - name: Build smoke test binaries
        run: |
          export CCACHE_DIR=~/.cache/ccache
          gcc -o tests/contract_smoke tests/contract_smoke.c -ldl
          gcc -o tests/state_smoke   tests/state_smoke.c   -ldl
          gcc -o tests/shader_smoke  tests/shader_smoke.c  -ldl
          gcc -o tests/draw_smoke    tests/draw_smoke.c    -ldl
          gcc -o tests/mcshape_smoke tests/mcshape_smoke.c -ldl
          gcc -o tests/texture_smoke tests/texture_smoke.c -ldl
          gcc -o tests/fbo_smoke     tests/fbo_smoke.c     -ldl
          gcc -o tests/3d_smoke      tests/3d_smoke.c      -ldl -lm
          gcc -o tests/render3d_smoke tests/render3d_smoke.c -ldl -lm
          gcc -o tests/multiframe_smoke tests/multiframe_smoke.c -ldl -lm
          gcc -o tests/sync_smoke tests/sync_smoke.c -ldl -lm
          gcc -o tests/query_smoke tests/query_smoke.c -ldl
          gcc -o tests/sampler_smoke tests/sampler_smoke.c -ldl
          gcc -o tests/swapchain_smoke tests/swapchain_smoke.c -ldl
          gcc -o tests/intattr_smoke tests/intattr_smoke.c -ldl
          gcc -o tests/multiubo_smoke tests/multiubo_smoke.c -ldl

      - name: Run EGL contract smoke
        run: |
          output=$(./tests/contract_smoke)
          echo "$output"
          echo "$output" | grep -q "ALL CONTRACT CHECKS PASSED"

      - name: Run GL state machine smoke
        run: |
          output=$(./tests/state_smoke)
          echo "$output"
          echo "$output" | grep -q "STATE SMOKE ALL PASSED"

      - name: Run shader pipeline smoke
        run: |
          output=$(./tests/shader_smoke)
          echo "$output"
          echo "$output" | grep -q "SHADER SMOKE ALL PASSED"

      - name: Run GL->Vulkan draw smoke (lavapipe)
        run: |
          output=$(./tests/draw_smoke)
          echo "$output"
          echo "$output" | grep -q "DRAW SMOKE ALL PASSED"

      - name: Run MC-style GUI shader smoke (lavapipe)
        run: |
          output=$(./tests/mcshape_smoke)
          echo "$output"
          echo "$output" | grep -q "MCSHAPE SMOKE ALL PASSED"

      - name: Run integer-attribute pipeline smoke (lavapipe)
        run: |
          output=$(./tests/intattr_smoke)
          echo "$output"
          echo "$output" | grep -q "INTATTR SMOKE ALL PASSED"

      - name: Run GL->Vulkan texture smoke (lavapipe)
        run: |
          output=$(./tests/texture_smoke)
          echo "$output"
          echo "$output" | grep -q "TEXTURE SMOKE ALL PASSED"

      - name: Run GL->Vulkan state-pipeline smoke (lavapipe)
        run: |
          output=$(./tests/fbo_smoke)
          echo "$output"
          echo "$output" | grep -q "FBO SMOKE ALL PASSED"

      - name: Run 3D depth/perspective smoke (lavapipe)
        run: |
          output=$(./tests/3d_smoke)
          echo "$output"
          echo "$output" | grep -q "3D SMOKE"

      - name: Run 3D scene render smoke (lavapipe)
        run: |
          output=$(./tests/render3d_smoke)
          echo "$output"
          echo "$output" | grep -q "RENDER SMOKE"

      - name: Run multiframe ring smoke (lavapipe)
        run: |
          output=$(./tests/multiframe_smoke)
          echo "$output"
          echo "$output" | grep -q "MULTIFRAME SMOKE ALL PASSED"

      - name: Run GL sync object smoke (lavapipe)
        run: |
          output=$(./tests/sync_smoke)
          echo "$output"
          echo "$output" | grep -q "SYNC SMOKE ALL PASSED"

      - name: Run S6 query object smoke (lavapipe)
        run: |
          output=$(./tests/query_smoke)
          echo "$output"
          echo "$output" | grep -q "QUERY SMOKE ALL PASSED"

      - name: Run S6 sampler object smoke (lavapipe)
        run: |
          output=$(./tests/sampler_smoke)
          echo "$output"
          echo "$output" | grep -q "SAMPLER SMOKE ALL PASSED"

      - name: Run swapchain surface smoke (offscreen on lavapipe)
        run: |
          output=$(./tests/swapchain_smoke)
          echo "$output"
          echo "$output" | grep -q "SWAPCHAIN SMOKE ALL PASSED"

      - name: Run multi-draw UBO smoke (lavapipe)
        run: |
          output=$(./tests/multiubo_smoke)
          echo "$output"
          echo "$output" | grep -q "MULTIUBO SMOKE ALL PASSED"

      - name: Convert 3D animation to MP4 + preview PNG (lavapipe)
        run: |
          ffmpeg -y -framerate 30 -i tests/render3d/frame_%04d.ppm \
                 -c:v libx264 -pix_fmt yuv420p -movflags +faststart tests/render3d.mp4
          ffmpeg -y -i tests/render3d/frame_0000.ppm tests/render3d.png
          ls -la tests/render3d.mp4 tests/render3d.png

      - name: Upload 3D render animation (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: mithril-render3d-animation
          path: |
            tests/render3d.mp4
            tests/render3d.png
          if-no-files-found: error
